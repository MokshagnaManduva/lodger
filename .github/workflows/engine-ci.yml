name: Engine and pack checks

on:
  push:
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"

permissions:
  contents: read

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macos-14 hosted runners were retired; the deployment target is still macOS 14.
    runs-on: macos-latest
    # The whole job takes a few minutes; never let a hang burn macOS minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r Tools/packtool/requirements.txt -r Scripts/requirements-release.txt
      # The runner's own Xcode toolchain. A separately installed Swift 6.0 hung in
      # "swift build" on the current image, and the project builds locally with
      # the system toolchain.
      - name: Report Swift toolchain
        run: swift --version
      - name: Pack and art checks
        run: make test
      - name: Engine self-tests, including both bundled characters
        run: LODGER_TEST_PACKS=Packs/klien:Packs/Norn make engine-test
      - name: Character behaviour checks
        run: make klien-test norn-test
      - name: Engine/pack separation
        run: make separation
      - name: Release and update regression checks
        run: make release-test
